<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Nocatee Cart Navigator · Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Outfit",ui-sans-serif,system-ui,sans-serif;background:#f6f4ee;color:#00364a}
  #map{position:fixed;inset:0;background:#efece2;height:100dvh;width:100%}
  #topbar{position:fixed;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 14px 0;box-sizing:border-box;z-index:1100;display:flex;align-items:center;gap:10px;background:#00364a;color:#fff;box-shadow:0 2px 10px rgba(0,54,74,.25)}
  #brand{display:flex;align-items:center;gap:10px;min-width:0}
  #badge{width:34px;height:34px;border-radius:50%;background:#0099ba;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
  #brandName{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  #brandTag{font-size:9px;font-weight:600;color:#8fd3e0;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
  #tabs{display:flex;gap:6px;margin-left:auto;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
  #tabs button{border:0;background:transparent;color:#cfe4ea;font:600 12px "Outfit";padding:7px 14px;border-radius:999px;cursor:pointer}
  #tabs button.on{background:#fff;color:#00364a}
  #tabs button.devTag{background:#ba5700;color:#fff}
  #panel{position:fixed;z-index:1200;left:12px;bottom:12px;top:calc(66px + env(safe-area-inset-top));width:min(330px,94vw);background:#fff;color:#00364a;border:1px solid #dbe3e5;border-radius:18px;box-shadow:0 8px 28px rgba(0,54,74,.16);padding:14px;overflow:auto;font-size:13px}
  #panel.collapsed{height:auto;top:auto;overflow:hidden;padding:8px 12px;cursor:pointer}
  #panel.collapsed .mode,#panel.collapsed label.tgl,#panel.collapsed #gapsList,#panel.collapsed #gapActions,#panel.collapsed #drawActions,#panel.collapsed #savedGapsBox,#panel.collapsed #export,#panel.collapsed .legend,#panel.collapsed #routeFields,#panel.collapsed #btnHide{display:none!important}
  #panel.collapsed h1{margin:0;font-size:14px}
  h1{font-size:15px;margin:0 0 8px;color:#00788f;font-weight:700;display:flex;align-items:center;gap:8px}
  #btnHide{margin-left:auto;background:#e6f3f6;border:1px solid #0099ba;color:#00788f;border-radius:8px;padding:2px 8px;font:700 12px "Outfit";cursor:pointer}
  .mode{display:flex;gap:5px;margin:8px 0}
  .mode button{flex:1;background:#fff;color:#2e5562;border:1px solid #dbe3e5;border-radius:999px;padding:7px 4px;font:600 12px "Outfit";cursor:pointer}
  .mode button.on{background:#0099ba;border-color:#0099ba;color:#fff}
  label.tgl{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:7px;color:#2e5562;cursor:pointer}
  input[type=checkbox]{accent-color:#0099ba}
  #routeFields{margin:8px 0;display:flex;flex-direction:column;gap:5px;font-size:12px}
  #routeFields div{display:flex;gap:4px;align-items:center}
  #routeFields span:first-child{flex:1;color:#2e5562}
  #routeFields .val{color:#00788f;font-weight:600}
  #routeFields button{color:#fff;border:0;border-radius:999px;padding:3px 10px;font:600 11px "Outfit";cursor:pointer}
  #setStart{background:#0099ba}#setDest{background:#ba5700}#clrStart,#clrDest{background:#9db4bc}
  #export{background:#0099ba;color:#fff;font:700 13px "Outfit";width:100%;margin-top:10px;padding:9px;border-radius:999px;border:0;cursor:pointer}
  #export:disabled{background:#dbe3e5;color:#7a929b;cursor:not-allowed}
  #gapsList button{display:block;width:100%;text-align:left;margin:2px 0;background:#f6f4ee;color:#2e5562;border:1px solid #ece8de;border-radius:8px;padding:3px 6px;font-size:11px;cursor:pointer}
  #savedGapsBox{border-top:1px solid #dbe3e5;margin-top:8px;padding-top:6px}
  .out{font-size:12px;color:#2e5562;white-space:pre-wrap;margin-top:8px;background:#f6f4ee;border:1px solid #ece8de;border-radius:10px;padding:8px}
  .stat{font-size:11px;color:#7a929b;margin-top:6px}
  .legend{font-size:11px;color:#2e5562;margin-top:10px;line-height:1.7}
  .pill{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  #devBadge{position:fixed;right:12px;bottom:12px;z-index:1000;background:#ba5700;color:#fff;font:600 10px "Outfit";letter-spacing:.6px;padding:5px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #gapsMode{background:#fff;border:1px solid #0099ba;color:#00788f;border-radius:999px;padding:7px;font:600 12px "Outfit";cursor:pointer}
  #gapsMode.on{background:#0099ba;color:#fff}
@media (max-width:700px){
  #residentBar{flex-direction:column;align-items:stretch;width:94vw}
  .rrow{width:100%}
  #panel{left:3vw;width:94vw}
  #residentDestInput{max-width:100%}
  #residentRow{width:100%}
}
@keyframes logoFadeIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.leaflet-marker-icon.logo-img{animation:logoFadeIn .5s ease; -webkit-animation:logoFadeIn .5s ease}
</style>
</head>
<body>
<div id="map"></div>
<div id="topbar">
  <div id="brand">
    <div id="badge">CN</div>
    <div>
      <div id="brandName">Nocatee Cart Navigator</div>
      <div id="brandTag">EV PATH GPS · NETWORK EDITOR</div>
    </div>
  </div>
  <div id="tabs">
    <button id="tabMap" class="on">Map</button>
    <button id="tabDev" class="devTag">Developer</button>
  </div>
</div>
<div id="residentBar" style="display:flex;position:fixed;top:calc(66px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:1100;background:#fff;border:1px solid #dbe3e5;border-radius:18px;box-shadow:0 4px 16px rgba(0,54,74,.16);padding:10px 12px;flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100vw - 16px);box-sizing:border-box">
  <div class="rrow" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <div style="display:flex;flex-direction:column;font-size:11px;min-width:120px;flex:1;position:relative">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="color:#00788f;font-weight:700;font-size:11px;letter-spacing:.4px">WHERE TO?</span>
      <a href="#" id="startLink" style="color:#0099ba;font-size:10px;font-weight:600;text-decoration:underline;cursor:pointer">Set starting point</a>
      <span id="startPtLabel" style="font-size:10px;color:#2e5562;display:none;white-space:nowrap"></span>
    </div>
    <input id="residentDestInput" list="destPicklist" placeholder="Business or address in Nocatee…" style="border:0;outline:0;background:transparent;color:#00364a;font:700 16px Outfit;width:100%"/>
    <datalist id="destPicklist" style="display:none"></datalist>
    <div id="destAuto" style="display:none;position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#fff;border:1px solid #dbe3e5;border-radius:10px;box-shadow:0 6px 20px rgba(0,54,74,.18);z-index:1300;max-height:230px;overflow:auto"></div>
  </div>
  <button id="residentGo" style="background:#0099ba;color:#fff;border:0;border-radius:999px;padding:6px 14px;font:700 12px Outfit">GO</button>
  <button id="residentClear" title="Clear" style="background:#fff;color:#ba5700;border:1px solid #ba5700;border-radius:999px;padding:5px 10px;font:700 12px Outfit">✕</button>
  <button id="satToggle" title="Toggle satellite view" style="background:#e6f3f6;border:1px solid #0099ba;color:#00788f;border-radius:999px;padding:5px 10px;font:600 12px Outfit">🛰</button>
  <button id="recenterBtn" title="Recenter on my location" style="background:#e6f3f6;border:1px solid #0099ba;color:#00788f;border-radius:999px;padding:5px 10px;font:600 12px Outfit">◎</button>
  
  </div>
  <div id="residentStatusBar" style="font-size:11px;color:#2e5562;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none"></div>
  <div id="dbgLine" style="font-size:10px;color:#9db4bc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none"></div>
</div>
<div id="panel" style="display:none;position:fixed;z-index:1200;left:12px;bottom:12px;top:66px;width:min(330px,94vw);background:#fff;color:#00364a;border:1px solid #dbe3e5;border-radius:18px;box-shadow:0 8px 28px rgba(0,54,74,.16);padding:14px;overflow:auto;font-size:13px">
  <h1>🛺 Network editor <button id="btnHide" title="collapse">–</button></h1>
  <div class="mode">
    <button id="mTest" class="on">Test route</button>
    <button id="mFix">Fix points</button>
    <button id="mDraw">Draw trail</button>
    <button id="mRemove">Remove</button>
  </div>
  <div id="routeFields">
    <div><span>Starting:</span><span class="val" id="startLabel">—</span><button id="setStart">Set</button><button id="clrStart">✕</button></div>
    <div><span>Destination:</span><span class="val" id="destLabel">—</span><button id="setDest">Set</button><button id="clrDest">✕</button></div>
  </div>
  <label class="tgl"><input type="checkbox" id="netToggle" checked> show network</label>
  <label class="tgl"><input type="checkbox" id="showOthers" checked> show non-cart roads</label>
  <label class="tgl"><input type="checkbox" id="classifyMode"> classify: click a road to (un)EV-approve it</label>
  <label class="tgl"><input type="checkbox" id="nameMode"> name-check: click a path to see its name</label>
  <div class="mode" style="margin-top:8px"><button id="gapsMode">Gaps: show &amp; fix</button></div>
  <div id="gapsList" style="display:none;max-height:150px;overflow:auto;font-size:11px;margin-top:6px"></div>
  <div id="savedGapsBox" style="display:none">
    <div style="color:#ba5700;font-weight:700;margin-bottom:2px" id="savedGapsTitle">Saved for later (0)</div>
    <div id="savedGapsList" style="max-height:110px;overflow:auto"></div>
  </div>
  <div id="gapActions" style="display:none;gap:6px;margin-top:6px">
    <button id="gapFix" style="background:#00788f;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Fix (join)</button>
    <button id="gapLegit" style="background:#7a929b;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Legit gap</button>
    <button id="gapLater" style="background:#ba5700;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Save for later</button>
  </div>
  <div id="drawActions" style="display:none;gap:6px;margin-top:6px">
    <button id="drawFinish" style="background:#0099ba;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Finish trail</button>
    <button id="drawCancel" style="background:#7a929b;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Cancel</button>
  </div>
  <div class="mode" style="margin-top:8px"><button id="auditMode" onclick="auditModeClick(this)">Audit drawn paths</button></div>
  <div id="auditList" style="display:none;max-height:170px;overflow:auto;font-size:11px;margin-top:6px"></div>
  <div id="auditRename" style="display:none;gap:6px;margin-top:6px;align-items:center">
    <input id="auditNameInput" placeholder="New name" style="flex:1;min-width:90px;border:1px solid #dbe3e5;border-radius:8px;padding:5px 8px;font:600 12px Outfit;color:#00364a"/>
    <select id="auditNamePick" style="border:1px solid #dbe3e5;border-radius:8px;padding:4px;font:600 11px Outfit;color:#00364a;max-width:120px"><option value="">Group with…</option></select>
    <button id="auditApply" onclick="try{ applyAuditName(); }catch(e){ try{dbg('Rename error: '+e.message,true);}catch(_){} }" style="background:#0099ba;color:#fff;border:0;border-radius:999px;padding:6px 12px;font:700 11px Outfit">Rename</button>
  </div>
  <button id="export" disabled>Export corrected graph.json</button>
  <div class="stat" id="stat">loading…</div>
  <div class="legend">
    <span class="pill" style="background:#1f9d55"></span>trail <span class="pill" style="background:#2e7d32"></span>EV road
    <span class="pill" style="background:#78909c"></span>road <span class="pill" style="background:#d8d8d8"></span>unnamed<br/>
    Distinct hues = separate clusters.
  </div>
</div>
<div id="devBadge" style="display:none">DEVELOPER</div>
<div id="turnOverlay" style="display:none;position:fixed;inset:0;z-index:2000;background:#fff;color:#00364a;flex-direction:column">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #dbe3e5;background:#f6f4ee">
    <button id="turnClose" style="background:#e6f3f6;border:1px solid #0099ba;color:#00788f;border-radius:999px;padding:7px 14px;font:700 13px Outfit;cursor:pointer">✕ Back to map</button>
    <div style="font:700 15px Outfit">Turn-by-turn</div>
    <div id="turnOverlayDest" style="font-size:11px;color:#7a929b;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
  </div>
  <div id="turnList" style="flex:1;overflow:auto;padding:10px 16px"></div>
</div>
<div id="driveUI" style="display:none;position:fixed;top:66px;left:10px;right:10px;z-index:1100;gap:6px;flex-direction:column">
  <div id="nextTurn" style="display:flex;position:static;background:#0b2a38;border-radius:14px;box-shadow:0 6px 18px rgba(0,54,74,.35);padding:12px 16px;align-items:center;gap:12px;cursor:pointer" title="Open full turn-by-turn">
    <span id="nextTurnArrow" style="font-size:30px;color:#7de3f0;line-height:1;min-width:40px">→</span>
    <div style="flex:1;min-width:0">
      <div style="display:flex;gap:10px;align-items:baseline">
        <span style="font-weight:800;font-size:21px;color:#fff" id="nextTurnDist">—</span>
        <span style="font-weight:700;font-size:14px;color:#7de3f0" id="nextTurnText">—</span>
      </div>
      <div style="font-size:11px;color:#8fd3e0;margin-top:2px" id="nextTurnSub">—</div>
    </div>
  </div>
  <div id="turnSubRow" style="display:none;flex-direction:row;gap:8px;align-items:center;padding:0 4px">
    <span style="color:#7de3f0;font-weight:600;font-size:12px">and then</span>
    <span style="background:rgba(255,255,255,.92);color:#00364a;font-weight:600;font-size:12px;border-radius:8px;padding:3px 9px" id="nextTurnSubArrow">→</span>
  </div>
</div>
<div id="tripBar" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:1100;background:rgba(255,255,255,.97);border-top:1px solid #dbe3e5;padding:12px 18px calc(16px + env(safe-area-inset-bottom));align-items:center;gap:12px;box-shadow:0 -4px 16px rgba(0,54,74,.10)">
  <div style="flex:1">
    <div style="display:flex;gap:8px;align-items:baseline">
      <div id="tripEta" style="font:800 22px Outfit;color:#00364a;line-height:1">—</div>
      <div style="font-size:11px;color:#7a929b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="tripDest">—</div>
    </div>
    <div id="tripMeta" style="font-size:11px;color:#7a929b">—</div>
  </div>
  <button id="tripDone" style="background:#ba5700;color:#fff;border:0;border-radius:999px;padding:12px 22px;font:800 14px Outfit;min-width:72px;box-shadow:0 2px 8px rgba(186,87,0,.4)">End</button>
</div>

    const abx=bx-ax,aby=by-ay,len2=abx*abx+aby*aby;let t=0;if(len2>1e-12){t=((latlng.lng*cosv-ax)*abx+(latlng.lat-ay)*aby)/len2;t=t<0?0:t>1?1:t;}
    const dx=latlng.lng*cosv-(ax+abx*t),dy=latlng.lat-(ay+aby*t),d=dx*dx+dy*dy;

function isCartLegalNode(j){ for(let e=0;e<G.edgesA.length;e++){ if((G.edgesA[e]===j||G.edgesB[e]===j)&&isCartLegal(e)) return true;} return false; }
function isCartLegal(i){
  const ni=G.edgesNameIdx[i];
  if(ni>=0&&FORBIDDEN.has(G.names[ni].toLowerCase()))return false;
  if(ni>=0&&removedNames.has(G.names[ni]))return false;
  if(removedEdges.has(i))return false;
  if(G.edgesPath && G.edgesPath[i]===1)return true;
  if(G.edgesEV && G.edgesEV[i]===1)return true;
  return evSet.has(ni>=0?G.names[ni].toLowerCase():"");
}
const COMP_COLORS=["#1f9d55","#00695c","#2e9e5b","#00796b","#43a047","#00897b","#33691e","#00a970","#1b5e20","#00bfa5"];

function computeComponents(){
  const N=G.nodes.length/2, adj=Array.from({length:N},()=>[]);
  for(let i=0;i<G.edgesA.length;i++){ if(!isCartLegal(i))continue; adj[G.edgesA[i]].push(G.edgesB[i]); adj[G.edgesB[i]].push(G.edgesA[i]); }
  compOf=new Int32Array(N).fill(-1); nComp=0;
  for(let s=0;s<N;s++){
    if(compOf[s]!==-1)continue; const st=[s]; compOf[s]=nComp;
    while(st.length){const u=st.pop();for(const v of adj[u])if(compOf[v]===-1){compOf[v]=nComp;st.push(v);}}
    nComp++;
  }
  const sz=new Array(nComp).fill(0);for(let i=0;i<N;i++)sz[compOf[i]]++;
  return sz;
}

    if(isCartLegal(i)){
      const c=compOf[a]; const key="comp"+c;
      (segs[key]=segs[key]||{edges:[],color:compColor(c)}).edges.push(p);

    } else if(showOthers && G.edgesNameIdx[i]>=0){

      (segs.other=segs.other||{edges:[],color:"#d8d8d8"}).edges.push(p);

function dijkstraCart(s,t,adj){

      for(let j=0;j<base/2;j++){ if(!isCartLegalNode(j))continue; const d=hav(pt,[G.nodes[j*2],G.nodes[j*2+1]]); if(d<bd){bd=d;best=j;} }
      if(best!==null){ G.edgesA.push(Math.min(id,best)); G.edgesB.push(Math.max(id,best)); G.edgesW.push(Math.max(1,Math.round(bd))); G.edgesPath.push(1); G.edgesNameIdx.push(-1); if(G.edgesEV)G.edgesEV.push(1); }
    };
    bridge(ids[0],[drawPts[0][0],drawPts[0][1]]);
    bridge(ids[ids.length-1],[drawPts[drawPts.length-1][0],drawPts[drawPts.length-1][1]]);
    // durable marker: record the drawn edge indices
    G.drawnEdges = G.drawnEdges || [];
    for(let e2=(G.edgesA.length-ids.length+1)-(ids.length-1); e2<G.edgesA.length; e2++){ if(!G.drawnEdges.includes(e2)) G.drawnEdges.push(e2); }
    exportBtn.disabled=false;
    setStatus("Drew a new trail ("+ids.length+" points, "+(ids.length-1)+" segments) — on network. Continue or Export.");
    ensureNetwork();
  } else { setStatus("Need at least 2 clicks to draw a trail — click the map first."); }
  drawPoly=null; drawPts=[]; document.getElementById("drawActions").style.display="none";
}

function snapPointToNetwork(lat,lng){
  const cos=Math.max(1e-9,Math.cos(lat*Math.PI/180));let best={lat:lat,lng:lng,d:1e18};
  for(let i=0;i<G.edgesA.length;i++){const a=G.edgesA[i],b=G.edgesB[i];
    const ax=G.nodes[a*2+1]*cos,ay=G.nodes[a*2],bx=G.nodes[b*2+1]*cos,by=G.nodes[b*2];
    const abx=bx-ax,aby=by-ay,len2=abx*abx+aby*aby;let t=0;if(len2>1e-12){t=((lng*cos-ax)*abx+(lat-ay)*aby)/len2;t=t<0?0:t>1?1:t;}
    const dx=lng*cos-(ax+abx*t),dy=lat-(ay+aby*t),d=dx*dx+dy*dy;if(d<best.d)best={lat:ay+aby*t,lng:(ax+abx*t)/cos,d};}
  return best;
}

function hav2(i,j){ const n=G.nodes; const dlat=(n[i*2]-n[j*2])*110574, dlng=(n[i*2+1]-n[j*2+1])*Math.cos((n[i*2]+n[j*2])/2*Math.PI/180)*111320; return Math.hypot(dlat,dlng); }
function computeGapsOnline(){
  const N=G.nodes.length/2, n=G.nodes, cart=new Set();
  for(let e=0;e<G.edgesA.length;e++){ if(isCartLegal(e)){ cart.add(G.edgesA[e]); cart.add(G.edgesB[e]); } }
  const comp=new Array(N).fill(-1); let nc=0; const adj=[...Array(N)].map(()=>[]);
  for(let e=0;e<G.edgesA.length;e++){ if(isCartLegal(e)){ const a=G.edgesA[e],b=G.edgesB[e]; adj[a].push(b); adj[b].push(a); } }
  for(let s=0;s<N;s++){ if(comp[s]!==-1||!cart.has(s))continue; const st=[s]; comp[s]=nc;
    while(st.length){ const u=st.pop(); for(const v of adj[u]){ if(comp[v]===-1&&cart.has(v)){ comp[v]=nc; st.push(v);} } } nc++; }
  const arr=[...cart]; const out=[];
  for(let ii=0;ii<arr.length;ii++){ const i=arr[ii];
    for(let jj=ii+1;jj<arr.length;jj++){ const j=arr[jj];
      if(comp[i]===comp[j])continue;
      const d=hav2(i,j);
      if(d<=60) out.push({i,j,d:d,ci:comp[i],cj:comp[j],ai:n[i*2],bi:n[i*2+1],aj:n[j*2],bj:n[j*2+1],status:'open'});
    }
  }
  return out;
}

function gapAction(action){
  if(!currentGap)return;
  const g=currentGap;
  if(action==='fix'){
    G.nodes[g.j*2]=G.nodes[g.i*2]; G.nodes[g.j*2+1]=G.nodes[g.i*2+1];
    const a=Math.min(g.i,g.j), b=Math.max(g.i,g.j);
    let has=false; for(let e=0;e<G.edgesA.length;e++){ if(G.edgesA[e]===a&&G.edgesB[e]===b){has=true;break;} }
    if(!has){ G.edgesA.push(a); G.edgesB.push(b); G.edgesW.push(1); G.edgesPath.push(1); G.edgesNameIdx.push(-1); if(G.edgesEV)G.edgesEV.push(1); }
    g.status='fixed'; msg.textContent='FIXED gap '+a+'-'+b+' (merged).';
  } else if(action==='later'){
    g.status='saved'; msg.textContent='Saved gap '+g.i+'-'+g.j+' for later (on-site verification pending).';
  } else {
    g.status='legit'; msg.textContent='Marked gap '+g.i+'-'+g.j+' LEGIT (real gap, no route).';
  }
  currentGap=null; document.getElementById('gapActions').style.display='none';
  exportBtn.disabled=false;
  renderGapsList(); drawGapMarkers();
}

// tab wiring: Map -> resident (clean user map), Developer -> editor
map.on('zoomend',()=>{ updateLogoZoom(); });

oldMapTab.addEventListener('click',()=>{ // just in case duplicates, guard

  document.getElementById('panel').style.display='block';

// ---- Audit drawn paths ----
var auditSel=[]; // selected edge ids of current trail
var auditTrails=[];
function findDrawnTrails(){
  if(!G||!G.nodes) return [];
  const N=G.nodes.length/2;
  const band=Math.max(0,N-160);
  const drawnSet = new Set((G.drawnEdges||[]));
  // include: durable drawn marks, OR band edges (drawn legacy), OR any UNNAMED edge (user candidates)
  const useBand=true;
  const trails=[];
  const seen=new Set();
  const e2map={};
  for(let i=0;i<G.edgesA.length;i++){
    const a=G.edgesA[i], b=G.edgesB[i];
    const ni=G.edgesNameIdx[i];
    const isDrawn = drawnSet.has(i) || (a>=band||b>=band) || ni<0;   // unnamed = candidate
    if(isDrawn){ e2map[i]=[a,b]; }
  }
  // group drawn edges into connected chains
  const byNode={};
  Object.keys(e2map).forEach(k=>{ const [a,b]=e2map[k]; (byNode[a]=byNode[a]||[]).push(+k); (byNode[b]=byNode[b]||[]).push(+k); });
  const used=new Set();
  Object.keys(e2map).forEach(k=>{
    if(used.has(+k)) return;
    const chain=[]; const q=[+k]; used.add(+k);
    while(q.length){ const e=q.pop(); chain.push(e); const [a,b]=e2map[e];
      (byNode[a]||[]).forEach(n=>{ if(!used.has(n)){ used.add(n); q.push(n);} });
      (byNode[b]||[]).forEach(n=>{ if(!used.has(n)){ used.add(n); q.push(n);} });
    }
    trails.push(chain);
  });
  return trails;
}
function renderAudit(){
  const box=document.getElementById('auditList');
  auditTrails=findDrawnTrails();
  box.innerHTML='<b>Unnamed/drawn chains: '+auditTrails.length+'</b><br/>'+
    auditTrails.map((chain,i)=>{
      const e0=chain[0]; const a=G.edgesA[e0], b=G.edgesB[e0];
      const lat=(G.nodes[a*2]+G.nodes[b*2])/2, lng=(G.nodes[a*2+1]+G.nodes[b*2+1])/2;
      const nm=G.edgesNameIdx[e0]>=0?G.names[G.edgesNameIdx[e0]]:'(unnamed)';
      return `<button data-a="${i}" style="display:block;width:100%;text-align:left;margin:2px 0;background:#f6f4ee;color:#2e5562;border:1px solid #ece8de;border-radius:8px;padding:3px 6px;font-size:11px">${nm} · ${chain.length} seg · ${lat.toFixed(4)},${lng.toFixed(4)}</button>`;
    }).join('');
  box.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    const i=+btn.dataset.a;
    selectAudit(i);
  }));
}
function selectAudit(i){
  auditSel=auditTrails[i]||[];
  const box=document.getElementById('auditRename'); box.style.display='flex';
  const inp=document.getElementById('auditNameInput');
  const e0=auditSel[0];
  inp.value=(e0!==undefined&&G.edgesNameIdx[e0]>=0)?G.names[G.edgesNameIdx[e0]]:'';
  setStatus('Selected drawn path with '+auditSel.length+' segments — type a name or group with an existing one.');
  fillAuditNamePick();
  // highlight
  if(auditLayer) map.removeLayer(auditLayer);
  auditLayer=L.layerGroup().addTo(map);
  auditSel.forEach(e=>{ const a=G.edgesA[e],b=G.edgesB[e];
    L.polyline([[G.nodes[a*2],G.nodes[a*2+1]],[G.nodes[b*2],G.nodes[b*2+1]]],{color:'#ff9800',weight:5,opacity:.95}).addTo(auditLayer);
  });
  // zoom to the selected path
  try{
    const ll=[]; auditSel.forEach(e=>{ const a=G.edgesA[e],b=G.edgesB[e]; ll.push([G.nodes[a*2],G.nodes[a*2+1]]); ll.push([G.nodes[b*2],G.nodes[b*2+1]]); });
    if(ll.length){ map.fitBounds(ll,{padding:[60,60],maxZoom:17}); }
  }catch(e){}
}
function fillAuditNamePick(){
  const sel=document.getElementById('auditNamePick');
  sel.innerHTML='<option value="">Group with…</option>';
  (G.names||[]).forEach((nm,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=nm; sel.appendChild(o); });
}
function applyAuditName(){
  const inp=document.getElementById('auditNameInput');
  const sel=document.getElementById('auditNamePick');
  let nm=inp.value.trim();
  if(!nm && sel.value!==''){ nm=G.names[+sel.value]; }
  if(!nm){ setStatus('Enter a name or pick one to group with.'); return; }
  if(!auditSel.length){ setStatus('Select a drawn path first.'); return; }
  // get or create name index
  let idx=G.names.indexOf(nm);
  if(idx<0){ idx=G.names.length; G.names.push(nm); }
  let total=0;
  auditSel.forEach(e=>{ G.edgesNameIdx[e]=idx; total++; });
  dbg('Named '+total+' segments "'+nm+'" — added to graph & removed from list.', false);
  exportBtn.disabled=false;
  // remove this trail from the audit list (it's now named)
  try{ auditTrails = auditTrails.filter(t=>t!==auditSel); }catch(e){}
  auditSel=[];
  document.getElementById('auditNameInput').value='';
  document.getElementById('auditRename').style.display='none';
  renderAudit();
  // auto-advance to the next unnamed trail
  try{ if(auditTrails&&auditTrails[0]){ selectAudit(0); dbg('Next: unnamed drawn path — rename or group.', false); } }catch(e){}
  // make Export clearly available + scroll it into view
  try{ const eb=document.getElementById('export'); eb.style.boxShadow='0 0 0 2px #0099ba, 0 4px 12px rgba(0,153,186,.4)'; eb.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(e){}
  try{ ensureNetwork(); }catch(e){}
}

  }, 2500);

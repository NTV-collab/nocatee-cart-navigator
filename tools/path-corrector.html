<style>
  html,body{margin:0;height:100%;font-family:"Outfit",ui-sans-serif,system-ui,sans-serif;background:#f6f4ee;color:#00364a}
  #map{position:fixed;inset:0;background:#efece2}
  #topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:1100;display:flex;align-items:center;gap:10px;padding:0 14px;background:#00364a;color:#fff;box-shadow:0 2px 10px rgba(0,54,74,.25)}
  #brand{display:flex;align-items:center;gap:10px;min-width:0}
  #badge{width:34px;height:34px;border-radius:50%;background:#0099ba;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
  #brandName{font-size:15px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #brandTag{font-size:10px;font-weight:600;color:#8fd3e0;letter-spacing:.4px}
  #tabs{display:flex;gap:6px;margin-left:auto;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
  #tabs button{border:0;background:transparent;color:#cfe4ea;font:600 12px "Outfit";padding:7px 14px;border-radius:999px;cursor:pointer}
  #tabs button.on{background:#fff;color:#00364a}
  #tabs button.devTag{background:#ba5700;color:#fff}
  #panel{position:fixed;z-index:1200;left:12px;bottom:12px;top:66px;width:min(330px,94vw);background:#fff;color:#00364a;border:1px solid #dbe3e5;border-radius:18px;box-shadow:0 8px 28px rgba(0,54,74,.16);padding:14px;overflow:auto;font-size:13px}
  #panel.collapsed{height:auto;top:auto;overflow:hidden;padding:8px 12px;cursor:pointer}
  #panel.collapsed .mode,#panel.collapsed label.tgl,#panel.collapsed #gapsList,#panel.collapsed #gapActions,#panel.collapsed #drawActions,#panel.collapsed #savedGapsBox,#panel.collapsed #export,#panel.collapsed .legend,#panel.collapsed #routeFields,#panel.collapsed #btnHide{display:none!important}
  #panel.collapsed h1{margin:0;font-size:14px}
  h1{font-size:15px;margin:0 0 8px;color:#00788f;font-weight:700;display:flex;align-items:center;gap:8px}
  #btnHide{margin-left:auto;background:#e6f3f6;border:1px solid #0099ba;color:#00788f;border-radius:8px;padding:2px 8px;font:700 12px "Outfit";cursor:pointer}
  .mode{display:flex;gap:5px;margin:8px 0}
  .mode button{flex:1;background:#fff;color:#2e5562;border:1px solid #dbe3e5;border-radius:999px;padding:7px 4px;font:600 12px "Outfit";cursor:pointer}
  .mode button.on{background:#0099ba;border-color:#0099ba;color:#fff}
  label.tgl{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:7px;color:#2e5562;cursor:pointer}
  input[type=checkbox]{accent-color:#0099ba}
  #routeFields{margin:8px 0;display:flex;flex-direction:column;gap:5px;font-size:12px}
  #routeFields div{display:flex;gap:4px;align-items:center}
  #routeFields span:first-child{flex:1;color:#2e5562}
  #routeFields .val{color:#00788f;font-weight:600}
  #routeFields button{color:#fff;border:0;border-radius:999px;padding:3px 10px;font:600 11px "Outfit";cursor:pointer}
  #setStart{background:#0099ba}#setDest{background:#ba5700}#clrStart,#clrDest{background:#9db4bc}
  #export{background:#0099ba;color:#fff;font:700 13px "Outfit";width:100%;margin-top:10px;padding:9px;border-radius:999px;border:0;cursor:pointer}
  #export:disabled{background:#dbe3e5;color:#7a929b;cursor:not-allowed}
  #gapsList button{display:block;width:100%;text-align:left;margin:2px 0;background:#f6f4ee;color:#2e5562;border:1px solid #ece8de;border-radius:8px;padding:3px 6px;font-size:11px;cursor:pointer}
  #savedGapsBox{border-top:1px solid #dbe3e5;margin-top:8px;padding-top:6px}

  .stat{font-size:11px;color:#7a929b;margin-top:6px}
  .legend{font-size:11px;color:#2e5562;margin-top:10px;line-height:1.7}
  .pill{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

<body>
<div id="map"></div>
<div id="topbar">
  <div id="brand">
    <div id="badge">CN</div>
    <div>
      <div id="brandName">Nocatee Cart Navigator</div>
      <div id="brandTag">EV PATH GPS · NETWORK EDITOR</div>
    </div>
  </div>
  <div id="tabs">
    <button id="tabMap">Map</button>
    <button id="tabDev" class="on devTag">Developer</button>
  </div>
</div>
<div id="residentBar" style="display:none;position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:1100;background:#fff;border:1px solid #dbe3e5;border-radius:999px;box-shadow:0 4px 16px rgba(0,54,74,.16);padding:8px 12px;display:none;gap:8px;align-items:center;max-width:min(560px,92vw)">
  <div style="display:flex;flex-direction:column;font-size:11px;min-width:0">
    <span style="color:#7a929b;font-weight:600">STARTING</span>
    <span id="residentStartVal" style="color:#00364a;font-weight:700;white-space:nowrap">Use my location</span>
  </div>
  <button id="residentStartBtn" style="background:#e6f3f6;border:1px solid #0099ba;color:#00788f;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Set point</button>
  <div style="width:1px;height:28px;background:#dbe3e5"></div>
  <div style="display:flex;flex-direction:column;font-size:11px;min-width:0;flex:1">
    <span style="color:#0099ba;font-weight:600">DESTINATION</span>
    <input id="residentDestInput" list="destPicklist" placeholder="Business or address in Nocatee…" style="border:0;outline:0;background:transparent;color:#00364a;font:700 13px Outfit;width:100%"/>
    <datalist id="destPicklist" style="display:none"></datalist>
    <div id="destAuto" style="display:none;position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#fff;border:1px solid #dbe3e5;border-radius:10px;box-shadow:0 6px 20px rgba(0,54,74,.18);z-index:1300;max-height:230px;overflow:auto"></div>
  </div>
  <button id="residentGo" style="background:#0099ba;color:#fff;border:0;border-radius:999px;padding:6px 14px;font:700 12px Outfit">GO</button>
  <div id="residentStatusBar" style="font-size:11px;color:#2e5562;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none"></div>
</div>
<div id="panel">
  <h1>🛺 Network editor <button id="btnHide" title="collapse">–</button></h1>
  <div class="mode">
    <button id="mTest" class="on">Test route</button>
    <button id="mFix">Fix points</button>
    <button id="mDraw">Draw trail</button>
    <button id="mRemove">Remove</button>
  </div>
  <div id="routeFields">
    <div><span>Starting:</span><span class="val" id="startLabel">—</span><button id="setStart">Set</button><button id="clrStart">✕</button></div>
    <div><span>Destination:</span><span class="val" id="destLabel">—</span><button id="setDest">Set</button><button id="clrDest">✕</button></div>
  </div>
  <label class="tgl"><input type="checkbox" id="showOthers" checked> show non-cart roads</label>
  <label class="tgl"><input type="checkbox" id="classifyMode"> classify: click a road to (un)EV-approve it</label>
  <div class="mode" style="margin-top:8px"><button id="gapsMode">Gaps: show &amp; fix</button></div>
  <div id="gapsList" style="display:none;max-height:150px;overflow:auto;font-size:11px;margin-top:6px"></div>
  <div id="savedGapsBox" style="display:none">
    <div style="color:#ba5700;font-weight:700;margin-bottom:2px" id="savedGapsTitle">Saved for later (0)</div>
    <div id="savedGapsList" style="max-height:110px;overflow:auto"></div>
  </div>
  <div id="gapActions" style="display:none;gap:6px;margin-top:6px">
    <button id="gapFix" style="background:#00788f;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Fix (join)</button>
    <button id="gapLegit" style="background:#7a929b;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Legit gap</button>
    <button id="gapLater" style="background:#ba5700;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Save for later</button>
  </div>
  <div id="drawActions" style="display:none;gap:6px;margin-top:6px">
    <button id="drawFinish" style="background:#0099ba;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Finish trail</button>
    <button id="drawCancel" style="background:#7a929b;color:#fff;border:0;border-radius:999px;padding:5px 10px;font:600 11px Outfit">Cancel</button>
  </div>
  <button id="export" disabled>Export corrected graph.json</button>
  <div class="stat" id="stat">loading…</div>
  <div class="legend">
    <span class="pill" style="background:#1f9d55"></span>trail <span class="pill" style="background:#2e7d32"></span>EV road
    <span class="pill" style="background:#78909c"></span>road <span class="pill" style="background:#d8d8d8"></span>unnamed<br/>
    Distinct hues = separate clusters.
  </div>
</div>
<div id="devBadge">DEVELOPER</div>
<div id="turnOverlay" style="display:none;position:fixed;inset:0;z-index:2000;background:#fff;color:#00364a;flex-direction:column">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #dbe3e5;background:#f6f4ee">
    <button id="turnClose" style="background:#e6f3f6;border:1px solid #0099ba;color:#00788f;border-radius:999px;padding:7px 14px;font:700 13px Outfit;cursor:pointer">✕ Back to map</button>
    <div style="font:700 15px Outfit">Turn-by-turn</div>
    <div id="turnOverlayDest" style="font-size:11px;color:#7a929b;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
  </div>
  <div id="turnList" style="flex:1;overflow:auto;padding:10px 16px"></div>
</div>
<div id="nextTurn" style="display:none;position:fixed;top:66px;right:12px;z-index:1100;background:#fff;border:1px solid #dbe3e5;border-radius:999px;box-shadow:0 4px 16px rgba(0,54,74,.16);padding:8px 14px;display:none;align-items:center;gap:10px;font-size:13px;cursor:pointer" title="Open full turn-by-turn">
  <span id="nextTurnArrow" style="font-size:22px;color:#0099ba;line-height:1">→</span>
  <div>
    <div style="font-weight:700;color:#00364a" id="nextTurnText">—</div>
    <div style="font-size:10px;color:#7a929b" id="nextTurnDist">—</div>
  </div>
</div>

function computeComponents(){

function cartNearest(lat,lng){
  let b=-1,bd=1e18;
  for(let i=0;i<G.nodes.length/2;i++){ if(compOf[i]===-1)continue; const d=hav([lat,lng],[G.nodes[i*2],G.nodes[i*2+1]]); if(d<bd){bd=d;b=i;} }
  return {idx:b,d:bd};
}
function dijkstraCart(s,t,adj){
  const N=compOf.length,dist=new Float64Array(N).fill(1e18),prev=new Int32Array(N).fill(-1);
  dist[s]=0;const pq=[[0,s]];
  while(pq.length){pq.sort((a,b)=>a[0]-b[0]);const u=pq.shift()[1];if(u===t)break;
    for(const[v,w]of adj[u]){const nd=dist[u]+w;if(nd<dist[v]){dist[v]=nd;prev[v]=u;pq.push([nd,v]);}}
  }
  if(dist[t]>=1e17)return null;
  const path=[];let c=t;while(c!==-1){path.unshift(c);c=prev[c];}return {path,dist:dist[t]};
}
function buildCartAdj(){
  const N=G.nodes.length/2,adj=Array.from({length:N},()=>[]);
  for(let i=0;i<G.edgesA.length;i++){if(!isCartLegal(i))continue;
    const a=G.edgesA[i],b=G.edgesB[i],w=G.edgesW[i],cost=G.edgesPath[i]===1?w:Math.round(w*1.2);
    adj[a].push([b,cost]);adj[b].push([a,cost]);}

}

function nearestTurn(path, idx){
  // pick a future turn within ~200m of given node idx
  for(let k=idx;k<Math.min(path.length,idx+40);k++){
    if(k+1<path.length){
      const a=path[k-1]??path[k-2]??0, b=path[k];

      if(k>1){
        const p0=[G.nodes[path[k-2]*2],G.nodes[path[k-2]*2+1]], p1=[G.nodes[path[k-1]*2],G.nodes[path[k-1]*2+1]], p2=[G.nodes[path[k]*2],G.nodes[path[k]*2+1]];
        const ang=Math.abs(bearing(p0,p1)-bearing(p1,p2));
        if(ang>20) return k;

    }
  }
  return -1;
}
function bearingAng(a,b){
  const toR=d=>d*Math.PI/180;
  const y=Math.sin(toR(b[1]-a[1]))*Math.cos(toR(b[0]));
  const x=Math.cos(toR(a[0]))*Math.sin(toR(b[0]))-Math.sin(toR(a[0]))*Math.cos(toR(b[0]))*Math.cos(toR(b[1]-a[1]));
  return Math.atan2(y,x)*180/Math.PI;
}

function buildTurnList(){
  const path=drivePath; if(!path||path.length<2){ return []; }
  const turns=[];
  let segStart=0, prevName=edgeNameOf(path[0],path[1]);
  let cum=0;
  for(let k=1;k<path.length;k++){
    cum+=hav([G.nodes[path[k-1]*2],G.nodes[path[k-1]*2+1]],[G.nodes[path[k]*2],G.nodes[path[k]*2+1]]);
    const nm=edgeNameOf(path[k-1],path[k]);
    if(k===path.length-1){ turns.push({km:Math.round(cum), text:(nm==='(unnamed)'?'the path':nm), arrive:true}); break; }
    if(nm!==prevName || k===1){
      const b0=bearingAng([G.nodes[path[k-1]*2],G.nodes[path[k-1]*2+1]],[G.nodes[path[k]*2],G.nodes[path[k]*2+1]]);
      const b1=bearingAng([G.nodes[path[k]*2],G.nodes[path[k]*2+1]],[G.nodes[path[k+1]*2],G.nodes[path[k+1]*2+1]]);
      const dg=Math.round((b1-b0+540)%360-180);

function updateNextTurn(offset){
  const path=drivePath; if(!path||path.length<2){ document.getElementById('nextTurnText').textContent='Arrive'; return; }
  const t=firstTurnIndex(path,offset);
  if(t<0){ document.getElementById('nextTurnArrow').textContent='✓'; document.getElementById('nextTurnText').textContent='Arrive at destination'; document.getElementById('nextTurnDist').textContent=''; return; }
  const p0=path[t-2],p1=path[t-1],p2=path[t];
  const b0=bearingAng([G.nodes[p0*2],G.nodes[p0*2+1]],[G.nodes[p1*2],G.nodes[p1*2+1]]);
  const b1=bearingAng([G.nodes[p1*2],G.nodes[p1*2+1]],[G.nodes[p2*2],G.nodes[p2*2+1]]);
  const dg=(b1-b0+540)%360-180;
  const arrow=Math.abs(dg)<25?'↑':dg<0?'←':'→';
  const turn=Math.abs(dg)<25?'Continue':(dg<-25&&dg>-155)?'Turn left':(dg>25&&dg<155)?'Turn right':'U-turn';
  document.getElementById('nextTurnArrow').textContent=arrow;
  let nm=edgeNameOf(p1,p2);
  if(nm==='(unnamed)') nm='the path';
  document.getElementById('nextTurnText').textContent=turn+' onto '+nm;
  // distance to that turn (m)
  let d=0;
  for(let k=offset||0;k<t;k++){ d+=hav([G.nodes[drivePath[k]*2],G.nodes[drivePath[k]*2+1]],[G.nodes[drivePath[k+1]*2],G.nodes[drivePath[k+1]*2+1]]); }

function firstTurnIndex(path, off){

    const b0=bearingAng([G.nodes[p0*2],G.nodes[p0*2+1]],[G.nodes[p1*2],G.nodes[p1*2+1]]);
    const b1=bearingAng([G.nodes[p1*2],G.nodes[p1*2+1]],[G.nodes[p2*2],G.nodes[p2*2+1]]);
    if(Math.abs((b1-b0+540)%360-180)>25) return k;

function runRoute(){

  if(compOf[A.idx]!==compOf[B.idx]){

function endDraw(){
  if(drawPts.length>=2){
    // snap first & last onto existing graph line (so it connects)
    const a=snapPointToNetwork(drawPts[0][0],drawPts[0][1]);
    drawPts[0]=[a.lat,a.lng];
    const b=snapPointToNetwork(drawPts[drawPts.length-1][0],drawPts[drawPts.length-1][1]);
    drawPts[drawPts.length-1]=[b.lat,b.lng];
    // add the connector to the graph as a new path
    const base=G.nodes.length/2;
    for(let k=0;k<drawPts.length;k++){ G.nodes.push(drawPts[k][0]); G.nodes.push(drawPts[k][1]); }
    const ids=drawPts.map((_,k)=>base+k);
    for(let k=0;k<ids.length-1;k++){
      G.edgesA.push(ids[k]); G.edgesB.push(ids[k+1]);
      G.edgesW.push(Math.max(1,Math.round(hav([drawPts[k][0],drawPts[k][1]],[drawPts[k+1][0],drawPts[k+1][1]]))));
      G.edgesPath.push(1); G.edgesNameIdx.push(-1);
      if(G.edgesEV) G.edgesEV.push(1);
    }
    // bridge the two ends into the nearest EXISTING cart node (<=25m) so it connects
    const bridge=(id,pt)=>{
      let best=null,bd=25;
      for(let j=0;j<base/2;j++){ if(!isCartLegalNode(j))continue; const d=hav(pt,[G.nodes[j*2],G.nodes[j*2+1]]); if(d<bd){bd=d;best=j;} }
      if(best!==null){ G.edgesA.push(Math.min(id,best)); G.edgesB.push(Math.max(id,best)); G.edgesW.push(Math.max(1,Math.round(bd))); G.edgesPath.push(1); G.edgesNameIdx.push(-1); if(G.edgesEV)G.edgesEV.push(1); }
    };
    bridge(ids[0],[drawPts[0][0],drawPts[0][1]]);
    bridge(ids[ids.length-1],[drawPts[drawPts.length-1][0],drawPts[drawPts.length-1][1]]);
    exportBtn.disabled=false;
    msg.textContent="Drew a new trail ("+ids.length+" points, "+(ids.length-1)+" segments) → exported/on network. Continue or Export.";

}

function snapPointToNetwork(lat,lng){
  const cos=Math.max(1e-9,Math.cos(lat*Math.PI/180));let best={lat:lat,lng:lng,d:1e18};
  for(let i=0;i<G.edgesA.length;i++){const a=G.edgesA[i],b=G.edgesB[i];
    const ax=G.nodes[a*2+1]*cos,ay=G.nodes[a*2],bx=G.nodes[b*2+1]*cos,by=G.nodes[b*2];
    const abx=bx-ax,aby=by-ay,len2=abx*abx+aby*aby;let t=0;if(len2>1e-12){t=((lng*cos-ax)*abx+(lat-ay)*aby)/len2;t=t<0?0:t>1?1:t;}
    const dx=lng*cos-(ax+abx*t),dy=lat-(ay+aby*t),d=dx*dx+dy*dy;if(d<best.d)best={lat:ay+aby*t,lng:(ax+abx*t)/cos,d};}

function hav2(i,j){ const n=G.nodes; const dlat=(n[i*2]-n[j*2])*110574, dlng=(n[i*2+1]-n[j*2+1])*Math.cos((n[i*2]+n[j*2])/2*Math.PI/180)*111320; return Math.hypot(dlat,dlng); }
function computeGapsOnline(){
  const N=G.nodes.length/2, n=G.nodes, cart=new Set();
  for(let e=0;e<G.edgesA.length;e++){ if(isCartLegal(e)){ cart.add(G.edgesA[e]); cart.add(G.edgesB[e]); } }
  const comp=new Array(N).fill(-1); let nc=0; const adj=[...Array(N)].map(()=>[]);
  for(let e=0;e<G.edgesA.length;e++){ if(isCartLegal(e)){ const a=G.edgesA[e],b=G.edgesB[e]; adj[a].push(b); adj[b].push(a); } }
  for(let s=0;s<N;s++){ if(comp[s]!==-1||!cart.has(s))continue; const st=[s]; comp[s]=nc;
    while(st.length){ const u=st.pop(); for(const v of adj[u]){ if(comp[v]===-1&&cart.has(v)){ comp[v]=nc; st.push(v);} } } nc++; }
  const arr=[...cart]; const out=[];
  for(let ii=0;ii<arr.length;ii++){ const i=arr[ii];
    for(let jj=ii+1;jj<arr.length;jj++){ const j=arr[jj];
      if(comp[i]===comp[j])continue;
      const d=hav2(i,j);
      if(d<=60) out.push({i,j,d:d,ci:comp[i],cj:comp[j],ai:n[i*2],bi:n[i*2+1],aj:n[j*2],bj:n[j*2+1],status:'open'});

  if(requestAnimationFrame||true){ if(network)map.removeLayer(network); if(gapLayer)map.removeLayer(gapLayer); }
  // hide the dev badge
  const db=document.getElementById('devBadge'); if(db)db.style.display='none';
  document.getElementById('tabMap').classList.add('on');
  document.getElementById('tabDev').classList.remove('on');
  residentFillDest();
  // try auto location
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      startPt={lat:pos.coords.latitude,lng:pos.coords.longitude};
      document.getElementById('residentStartVal').textContent='Your location';
      map.setView([startPt.lat,startPt.lng],14);
    },()=>{ document.getElementById('residentStartVal').textContent='Use my location'; },{timeout:6000,maximumAge:120000});
  }
}
function armDev(){
  document.getElementById('residentBar').style.display='none';
  document.getElementById('panel').style.display='block';
  document.getElementById('devBadge').style.display='block';
  ensureNetwork();
  drawGapMarkers&&drawGapMarkers();
  document.getElementById('tabDev').classList.add('on');
  document.getElementById('tabMap').classList.remove('on');
}
// tab wiring: Map -> resident (clean user map), Developer -> editor
const oldMapTab=document.getElementById('tabMap'); const oldDevTab=document.getElementById('tabDev');
oldMapTab.addEventListener('click',()=>{ // just in case duplicates, guard
  enterResident();
});
oldDevTab.addEventListener('click',()=>{ enterDev(); });
function enterDev(){
  document.getElementById('residentBar').style.display='none';
  document.getElementById('panel').style.display='block';
  const db=document.getElementById('devBadge'); if(db)db.style.display='block';
  ensureNetwork();
  document.getElementById('tabDev').classList.add('on');
  document.getElementById('tabMap').classList.remove('on');
}
document.getElementById('tabMap').addEventListener('click',()=>{document.getElementById('panel').style.display='none';document.getElementById('tabMap').classList.add('on');document.getElementById('tabDev').classList.remove('on');});
document.getElementById('tabDev').addEventListener('click',()=>{document.getElementById('panel').style.display='block';document.getElementById('tabDev').classList.add('on');document.getElementById('tabMap').classList.remove('on');});
document.getElementById('gapsMode').addEventListener('click',function(){ this.classList.toggle('on');
  gapMode=this.classList.contains('on');
  const lst=document.getElementById('gapsList'); lst.style.display=gapMode?'block':'none';
  if(gapMode){ if(!gapsLoaded){loadGaps();} else {renderGapsList(); drawGapMarkers();} }
  else if(gapLayer){map.removeLayer(gapLayer); gapLayer=null;}
});

const EV_URL = new URL("../app/public/data/ev_roads.json", location.href).href;
fetch(EV_URL).then(r=>r.ok?r.json():[]).then(arr=>{arr.forEach(x=>EV_NAMES.add(String(x).toLowerCase()));})
  .catch(()=>{})
  .then(()=>fetch(GRAPH_URL)).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(g=>{G=g;computeComponents();ensureNetwork();
    const b=g.bbox||null;if(b)map.fitBounds([[b[0],b[1]],[b[2],b[3]]],{padding:[20,20]});
  }).catch(e=>{stat.textContent="ERROR: "+e.message;msg.textContent="Graph failed to load.";});
</script>
